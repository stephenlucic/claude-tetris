name: Issue Triage

on:
  issues:
    types: [opened, edited]

concurrency:
  group: issue-triage-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  triage:
    if: github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Triage issue with Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Eres el asistente de triage de issues del repositorio ${{ github.repository }} (Tetris en JavaScript vanilla + Canvas; lee CLAUDE.md para el contexto).
            Issue a analizar: #${{ github.event.issue.number }} (evento: ${{ github.event.action }}).

            Pasos:
            1. Lee el issue con `gh issue view ${{ github.event.issue.number }} --comments` y los labels existentes con `gh label list`.
            2. Asigna los labels más apropiados usando SOLO labels que ya existan (ej. bug, enhancement, question, documentation) con `gh issue edit ${{ github.event.issue.number }} --add-label ...`. Si el evento es `edited`, quita con `--remove-label` los labels que ya no apliquen. No crees labels nuevos.
            3. Revisa el código relevante (game.js, index.html, style.css) para diagnosticar.
            4. Publica UN solo comentario de diagnóstico, en español, que empiece con el marcador `<!-- claude-triage -->`. Si ya existe un comentario con ese marcador (búscalo con `gh api repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments`), actualízalo con `gh api -X PATCH repos/${{ github.repository }}/issues/comments/<id> -f body=...` en vez de crear otro. Si no existe, créalo con `gh issue comment`.
               Secciones del comentario:
               - **Resumen**: qué se reporta, en 1-2 líneas.
               - **Tipo y severidad**: bug/feature/etc. y impacto.
               - **Causa probable**: archivos y funciones de game.js involucrados (con `archivo:línea`).
               - **Pasos de reproducción**: si aplica.
               - **Enfoque de solución sugerido**: cambios concretos a implementar.
               - **Información faltante**: preguntas al autor, si las hay.

            Restricciones: no modifiques código, no cierres el issue, no crees PRs ni ramas.
          claude_args: >-
            --allowedTools "Bash(gh issue view:*),Bash(gh issue edit:*),Bash(gh issue comment:*),Bash(gh label list:*),Bash(gh api:*),Read,Grep,Glob"
